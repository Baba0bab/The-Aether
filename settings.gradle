pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'aether'

// Nitrogen and Cumulus are built from source alongside the Aether, as no Fabric builds are published for this version yet.
include ':nitrogen', ':cumulus'
project(':nitrogen').projectDir = file('libs/nitrogen')
project(':cumulus').projectDir = file('libs/cumulus')
