plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.matthewprenger.cursegradle' version '[1.4,1.5)'
    id 'com.modrinth.minotaur' version '[2,3)'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}-fabric"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

allprojects {
    repositories {
        maven { url = "https://maven.fabricmc.net" }
        maven { url = "https://maven.blamejared.com" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.nucleoid.xyz/releases" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        maven { url = "https://api.modrinth.com/maven" }
        mavenCentral()
    }
}

loom {
    accessWidenerPath = file('src/main/resources/aether.accesswidener')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "nitrogen_internals" {
            sourceSet(project(':nitrogen').sourceSets.main)
        }
        "cumulus_menus" {
            sourceSet(project(':cumulus').sourceSets.main)
        }
    }

    runs {
        client {
            vmArg "-Dowo.debug=false"
        }
        server {
            programArg '--nogui'
        }
    }
}

fabricApi {
    // The Fabric edition has no data generators of its own: src/generated/resources is generated by the NeoForge edition and copied here.
    // Fabric's data generation clears its output folder, so it must not write to src/generated/resources.
    configureDataGeneration {
        modId = "aether"
        client = true
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    exclude '.cache/'
    // The generated pack.mcmeta declares the NeoForge data pack format, which makes the client flag the mod's resources as incompatible.
    // Without it, Fabric creates the right metadata for both pack types.
    exclude 'pack.mcmeta'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include implementation("me.shedaniel:mm:2.4.1")

    // Nitrogen and Cumulus are built from source (see settings.gradle).
    implementation project(':nitrogen')
    include project(':nitrogen')
    implementation project(':cumulus')
    include project(':cumulus')

    include implementation("eu.pb4:trinkets:${project.trinkets_version}")

    include implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_version}")

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    compileOnly "maven.modrinth:jade:${project.jade_version}"
    compileOnly "maven.modrinth:lootr:${project.lootr_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        mod_url                : mod_url,
        mod_tracker            : mod_tracker,
        mod_credits            : mod_credits,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        fabric_version         : fabric_version,
        fabric_version_range   : fabric_version_range,
        fabric_loader_version_range : fabric_loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << "-Xmaxerrs" << "9000"
}

tasks.register('sourceJar', Jar) {
    dependsOn 'classes'
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/The-Aether-Team/The-Aether"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        id = "${curseforge_id}"
        releaseType = "${version_type}"
        changelog = file("$rootDir/docs/CHANGELOG.md")
        changelogType = "markdown"
        addGameVersion("${minecraft_version}")
        addGameVersion("Fabric")
        mainArtifact(tasks.jar) {
            displayName = "${project.mod_name} - ${version}"
            relations {
                requiredDependency "fabric-api"
                embeddedLibrary "trinkets-updated"
                embeddedLibrary "cumulus"
            }
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${modrinth_id}"
    versionNumber = "${version}"
    versionType = "${version_type}"
    versionName = "${mod_name} - ${version}"
    changelog = new File("$rootDir/docs/CHANGELOG.md").text
    uploadFile = tasks.jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        embedded.version "trinkets-updated", "${project.trinkets_version}"
        embedded.version "cumulus", "${project.cumulus_version}"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
